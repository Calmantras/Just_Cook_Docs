[project]
site_name = "Just Cook Documentation"
site_description = "Developer documentation for the Just Cook services and application."
site_author = "Just Cook contributors"
docs_dir = "docs"
site_dir = "site"
use_directory_urls = true
nav = [
  { "Home" = "README.md" },
]

[project.theme]
variant = "modern"
features = [
  "navigation.sections",
  "navigation.expand",
  "navigation.path",
  "navigation.top",
  "toc.follow",
]

[project.markdown_extensions]
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]

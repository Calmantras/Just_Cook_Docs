[project]
site_name = "Just Cook Documentation"
site_description = "Developer documentation for the Just Cook services and application."
site_author = "Just Cook contributors"
docs_dir = "docs"
site_dir = "site"
use_directory_urls = true
nav = [
  { "Home" = "README.md" },
  { "Overview" = [
    { "Project overview" = "01-overview/project-overview.md" },
    { "System architecture" = "01-overview/system-architecture.md" },
    { "Repository structure" = "01-overview/repository-structure.md" },
  ] },
  { "Getting started" = [
    { "Prerequisites" = "02-getting-started/prerequisites.md" },
    { "Local development setup" = "02-getting-started/local-development-setup.md" },
    { "Environment variables" = "02-getting-started/environment-variables.md" },
    { "Troubleshooting" = "02-getting-started/troubleshooting.md" },
  ] },
  { "Authentication" = [
    { "Overview" = "03-auth/overview.md" },
    { "Authentication flow" = "03-auth/authentication-flow.md" },
  ] },
  { "Backend" = [
    { "Overview" = "04-backend/overview.md" },
    { "Data model" = "04-backend/data-model.md" },
  ] },
  { "Frontend" = [
    { "Overview" = "05-frontend/overview.md" },
    { "Routes and state" = "05-frontend/routes-and-state.md" },
  ] },
  { "Index" = [
    { "Overview" = "06-index/overview.md" },
  ] },
  { "API" = [
    { "API overview" = "07-api/api-overview.md" },
    { "Authentication endpoints" = "07-api/endpoints/auth.md" },
    { "Recipe endpoints" = "07-api/endpoints/recipes.md" },
    { "Category endpoints" = "07-api/endpoints/categories.md" },
  ] },
  { "Deployment" = [
    { "Deployment" = "08-deployment/deployment.md" },
  ] },
  { "Development" = [
    { "Coding guidelines" = "09-development/coding-guidelines.md" },
    { "Testing" = "09-development/testing.md" },
  ] },
]

[project.theme]
variant = "modern"
features = [
  "navigation.sections",
  "navigation.expand",
  "navigation.path",
  "navigation.top",
  "toc.follow",
]

[project.markdown_extensions]
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
